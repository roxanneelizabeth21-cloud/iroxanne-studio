    <!-- OneSignal Web Push (Typical Site, SDK v16) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        // Route-based prompt suppression: do not initialize OneSignal on
        // ad-traffic capture pages (/go/:slug) or admin/marketing routes.
        // Only public content pages initialize -> dashboard-managed slidedown.
        var path = window.location.pathname;
        var suppressed =
          path.indexOf("/go/") === 0 ||
          path === "/MusicAdmin" ||
          path === "/admin" ||
          path.indexOf("/admin/") === 0 ||
          path === "/AdminMusicLinks" ||
          path === "/marketing" ||
          path.indexOf("/marketing/") === 0;
        if (suppressed) return;
        await OneSignal.init({
          appId: "207bf919-30c4-4afd-9c71-db07a4258f24",
          allowLocalhostAsSecureOrigin: true
        });
        // v16 slidedown prompt — shows the native push permission request once
        // per browser. OneSignal suppresses repeat prompts automatically.
        try { await OneSignal.Slidedown.promptPush(); } catch (e) {}
      });
    </script>

    <script>
      // Apply saved theme on load — fall back to system preference when no choice saved
      (function() {
        var saved = localStorage.getItem('roxy-theme');
        var dark;
        if (saved === 'dark' || saved === 'light') {
          dark = saved === 'dark';
        } else {
          dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
